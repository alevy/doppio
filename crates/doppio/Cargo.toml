[package]
name = "doppio"
description = "A typed compiler pipeline for plain-text Ledger accounting -- parse, resolve, and elaborate .ledger files with a library API built for programmatic use."
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license-file = "../../LICENSE"
keywords.workspace = true
categories.workspace = true
autobenches = false

[dependencies]
chrono = { workspace = true }
miniz_oxide = { workspace = true }
pest = { workspace = true }
pest_derive = { workspace = true }
prost = { workspace = true }
regex = { workspace = true }
rust_decimal = { workspace = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
glob = { workspace = true }

[build-dependencies]
prost-build = "0.13"
protoc-bin-vendored = "3"

[dev-dependencies]
criterion = { workspace = true }
rust_decimal = { version = "1.40.0", features = ["macros"] }

[[bench]]
name = "parse"
harness = false

[[bench]]
name = "pipeline"
harness = false

[[bench]]
name = "serial"
harness = false

[[bench]]
name = "queries"
harness = false
