[package]
name = "doppio"
version = "0.1.0"
edition = "2024"
description = "A typed compiler pipeline for plain-text Ledger accounting — parse, resolve, and elaborate .ledger files with a library API built for programmatic use."
repository = "https://github.com/alevy/doppio"
license-file = "LICENSE"
autobenches = false
default-run = "dop"

[profile.release]
panic = "abort"    # Removes unwinding code, shrinking binary size and slightly boosting speed
strip = true       # Automatically strips debug symbols from the final binary
debug = false      # Tells the compiler not to generate debug symbols in the first place
lto = "fat"      # Performs heavy cross-crate optimization
codegen-units = 1 # Better optimization at the cost of longer compile times

[[bin]]
name = "dop"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["serde"] }
clap = { version = "4.5.59", features = ["derive"] }
glob = "0.3.3"
pest = "2.8.6"
pest_derive = "2.8.6"
postcard = { version = "1.1.3", features = ["use-std"] }
regex = "1"
rust_decimal = "1.40.0"
serde = { version = "1.0.228", features = ["derive"] }
serde-pickle = "1.2.0"
serde_json = "1"
xz = "0.1.0"

[[bench]]
name = "parse"
harness = false

[[bench]]
name = "pipeline"
harness = false

[[bench]]
name = "serial"
harness = false

[[bench]]
name = "queries"
harness = false

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
rust_decimal = { version = "1.40.0", features = ["macros"] }
tempfile = "3"
