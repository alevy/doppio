[workspace]
members = ["crates/doppio", "crates/doppio-categorize", "crates/doppio-cli"]
resolver = "3"

# Shared metadata that applies to every member crate by default. Crates
# can override individual fields locally.
[workspace.package]
version = "0.4.0-rc.1"
edition = "2024"
rust-version = "1.95.0"
repository = "https://github.com/alevy/doppio"
license-file = "LICENSE"
keywords = ["ledger", "accounting", "compiler", "finance"]
categories = ["finance", "parser-implementations"]

[workspace.dependencies]
# Shared deps with their versions pinned at workspace level. Each member
# crate re-declares the deps it actually uses with `workspace = true`.
chrono = { version = "0.4.42", default-features = false, features = ["serde"] }
clap = { version = "4.5.59", features = ["derive"] }
glob = "0.3.3"
miniz_oxide = "0.8"
pest = "2.8.6"
pest_derive = "2.8.6"
prost = "0.13"
regex = "1"
rust_decimal = "1.40.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
# Dev-deps shared across members:
criterion = { version = "0.8.2", features = ["html_reports"] }
tempfile = "3"

[profile.release]
panic = "abort"    # Removes unwinding code, shrinking binary size and slightly boosting speed
strip = true       # Automatically strips debug symbols from the final binary
debug = false      # Tells the compiler not to generate debug symbols in the first place
lto = "fat"        # Performs heavy cross-crate optimization
codegen-units = 1  # Better optimization at the cost of longer compile times
