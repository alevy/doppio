name: Web demo

on:
  push:
    branches: [main]
    paths:
      - "web/dashboard/**"
      - "web/dop/**"
      - "web/compile/**"
      - "web/package.json"
      - "crates/doppio/proto/**"
      - "crates/doppio-wasm/**"
      - "crates/doppio/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/dashboard/**"
      - "web/dop/**"
      - "web/compile/**"
      - "web/package.json"
      - "crates/doppio/proto/**"
      - "crates/doppio-wasm/**"
      - "crates/doppio/**"
      - ".github/workflows/web.yml"

# Allow only one concurrent deployment, cancelling in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-dashboard:
    name: Build dashboard (web/dashboard)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install workspace dependencies
        run: npm ci
      - name: Build doppio-dop (generates proto stubs + bundles)
        working-directory: web/dop
        run: npm run build
      - name: Test doppio-dop
        working-directory: web/dop
        run: npm test
      - name: Test dashboard
        working-directory: web/dashboard
        run: npm test
      - name: Type-check and build dashboard
        working-directory: web/dashboard
        run: npm run build
      - name: Upload dashboard dist
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: web/dashboard/dist

  build-compile:
    name: Build compile demo (web/compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          # Distinct cache from the workspace test job — different target.
          key: wasm-bindgen
      # Pin to the exact wasm-bindgen version specified in
      # crates/doppio-wasm/Cargo.toml (`wasm-bindgen = "=0.2.117"`).
      # If the Cargo dep is bumped, bump this too or the build will fail
      # with a version-mismatch error from wasm-bindgen-cli.
      - name: Install wasm-bindgen-cli (pinned to 0.2.117)
        run: cargo install wasm-bindgen-cli --version 0.2.117 --locked
      - name: Build doppio-wasm
        run: bash crates/doppio-wasm/build-wasm.sh
      - name: Assemble web/compile/dist
        run: |
          mkdir -p web/compile/dist
          cp web/compile/index.html web/compile/app.js web/compile/dist/
          cp -r crates/doppio-wasm/pkg web/compile/dist/pkg
          echo "==> web/compile/dist contents:"
          ls -lh web/compile/dist/
          echo "==> pkg/ contents:"
          ls -lh web/compile/dist/pkg/
      - name: Upload compile dist
        uses: actions/upload-artifact@v4
        with:
          name: compile-dist
          path: web/compile/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-dashboard, build-compile]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download dashboard dist
        uses: actions/download-artifact@v4
        with:
          name: dashboard-dist
          path: _site/dashboard
      - name: Download compile dist
        uses: actions/download-artifact@v4
        with:
          name: compile-dist
          path: _site/compile
      - name: Write landing page
        run: |
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>doppio · web demos</title>
              <link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>%E2%98%95</text></svg>" />
              <style>
                body { font: 16px/1.5 system-ui, sans-serif; max-width: 38em; margin: 4em auto; padding: 0 1em; color: #111; }
                h1 { font-size: 1.6em; margin-bottom: 0.25em; }
                p.tag { color: #666; margin-top: 0; }
                ul { list-style: none; padding: 0; }
                li { margin: 1.25em 0; padding: 1em 1.25em; border: 1px solid #e5e5e5; border-radius: 8px; }
                li a { font-weight: 600; text-decoration: none; color: #2563eb; }
                li a:hover { text-decoration: underline; }
                li p { margin: 0.25em 0 0; color: #444; }
                footer { margin-top: 3em; color: #888; font-size: 0.9em; }
                footer a { color: #2563eb; }
              </style>
            </head>
            <body>
              <h1>doppio</h1>
              <p class="tag">Browser demos for the doppio ledger compiler.</p>
              <ul>
                <li>
                  <a href="dashboard/">Dashboard</a>
                  <p>Loads a pre-compiled <code>.dop</code> journal and renders KPIs, category breakdowns, and income/expense charts. Validates the <code>.dop</code>-format-as-API claim end-to-end via a JS-native reader.</p>
                </li>
                <li>
                  <a href="compile/">Compile</a>
                  <p>Paste ledger / hledger / Beancount source and compile it to <code>.dop</code> in the browser via WebAssembly. No server round-trip.</p>
                </li>
              </ul>
              <footer>
                <a href="https://github.com/alevy/doppio">github.com/alevy/doppio</a>
              </footer>
            </body>
          </html>
          HTML
          echo "==> _site/ layout:"
          ls -lhR _site | head -40
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
